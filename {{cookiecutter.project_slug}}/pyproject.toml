[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
authors = [{ name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }]
{%- if cookiecutter.license == "MIT" %}
license = { text = "MIT" }
{%- elif cookiecutter.license == "Apache-2.0" %}
license = { text = "Apache-2.0" }
{%- else %}
license = { text = "Proprietary" }
{%- endif %}

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
{%- if cookiecutter.include_otel == "yes" %}
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
{%- endif %}
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[postgresql]>=4.9",
    "mutmut>=3.2",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    "pre-commit>=4.0",
    "commitizen>=4.1",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

# ─── Ruff ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py{{ cookiecutter.python_version|replace('.', '') }}"
src = ["src", "tests"]

[tool.ruff.lint]
# Hardened in phase D2. For now we keep the base ruleset to let phase B compile.
select = ["E", "F", "I", "B", "S", "UP", "RUF", "PTH", "TID", "T20", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "D"]
"alembic/versions/*" = ["D", "ERA"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Cross-layer imports are forbidden by Clean Architecture.
# Enforced more thoroughly by scripts/checks/no_third_party_in_domain.py.

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

# ─── ty (Astral type checker) ──────────────────────────────────────────
[tool.ty]
# Phase B starts non-strict to avoid false positives on Pydantic/SQLAlchemy.
# Phase D2 will set strict mode.

# ─── pytest ────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: pure unit tests, no I/O, no testcontainers",
    "integration: require testcontainers or external service mocks",
    "e2e: full stack via httpx.AsyncClient",
]

# ─── Coverage ──────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/{{ cookiecutter.package_name }}"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# ─── mutmut ────────────────────────────────────────────────────────────
[tool.mutmut]
paths_to_mutate = "src/{{ cookiecutter.package_name }}/domain,src/{{ cookiecutter.package_name }}/application"
runner = "uv run pytest -m unit -x -q"
tests_dir = "tests/unit"

# ─── Commitizen ────────────────────────────────────────────────────────
[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
update_changelog_on_bump = true
tag_format = "v$version"
