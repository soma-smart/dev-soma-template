name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build image + GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${% raw %}{{ github.actor }}{% endraw %}
          password: ${% raw %}{{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Determine version
        id: ver
        run: echo "version=${% raw %}{{ github.ref_name }}{% endraw %}" | sed 's/v//' >> $GITHUB_OUTPUT

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}:${% raw %}{{ github.ref_name }}{% endraw %}
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}:latest

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_TAG.md
        continue-on-error: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_TAG.md
          generate_release_notes: true
