name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write       # publish a GitHub Release
  packages: write       # push to GHCR
  id-token: write       # OIDC token used by cosign keyless signing

jobs:
  release:
    name: Build, scan, sign, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${% raw %}{{ github.actor }}{% endraw %}
          password: ${% raw %}{{ secrets.GITHUB_TOKEN }}{% endraw %}

      - name: Determine version
        id: ver
        run: echo "version=${% raw %}{{ github.ref_name }}{% endraw %}" | sed 's/v//' >> "$GITHUB_OUTPUT"

      - name: Build and push image (digest captured for cosign)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: |
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}:${% raw %}{{ github.ref_name }}{% endraw %}
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}:latest

      - name: Trivy image scan (release blocker)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${% raw %}{{ github.repository }}{% endraw %}@${% raw %}{{ steps.build.outputs.digest }}{% endraw %}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${% raw %}{{ github.repository }}{% endraw %}@${% raw %}{{ steps.build.outputs.digest }}{% endraw %}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless via Sigstore + GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes \
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}@${% raw %}{{ steps.build.outputs.digest }}{% endraw %}

      - name: Attach SBOM to the image as an attestation
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign attest --yes \
            --predicate sbom.cdx.json \
            --type cyclonedx \
            ghcr.io/${% raw %}{{ github.repository }}{% endraw %}@${% raw %}{{ steps.build.outputs.digest }}{% endraw %}

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_TAG.md
        continue-on-error: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG_TAG.md
          generate_release_notes: true
          files: sbom.cdx.json
