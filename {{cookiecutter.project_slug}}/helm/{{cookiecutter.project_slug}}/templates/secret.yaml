{% raw %}{{- if or .Values.secrets.dbUrl .Values.secrets.authJwtSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}-secrets
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.dbUrl }}
  DB_URL: {{ .Values.secrets.dbUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.authJwtSecret }}
  AUTH_JWT_SECRET: {{ .Values.secrets.authJwtSecret | quote }}
  {{- end }}
{{- end }}
{% endraw %}
