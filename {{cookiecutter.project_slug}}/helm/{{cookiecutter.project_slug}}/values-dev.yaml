replicaCount: 1

config:
  logFormat: console
  logLevel: DEBUG
  otelTracesSamplerArg: "1.0"

ingress:
  enabled: true
  hosts:
    - host: {{ cookiecutter.project_slug }}.dev.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
