replicaCount: 3

config:
  logFormat: json
  logLevel: WARNING
  otelTracesSamplerArg: "0.1"

ingress:
  enabled: true
  hosts:
    - host: {{ cookiecutter.project_slug }}.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: {{ cookiecutter.project_slug }}-tls
      hosts:
        - {{ cookiecutter.project_slug }}.example.com

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 2000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

metrics:
  enabled: true
